name: Build/release

on:
  push:
    # Built artifacts upload to the GitHub Release that semantic-release
    # created, so this workflow only runs on version tags. Everyday pushes
    # to master run the Release workflow instead (lint/test/semantic-release),
    # which keeps one push == one build instead of building everything twice.
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    # Platforms to build on/for
    strategy:
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          
      - name: Ensure distutils is available for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Prepare for app notarization
        if: startsWith(matrix.os, 'macos')
        # Import Apple API key for app notarization on macOS
        run: |
          mkdir -p ~/private_keys/
          echo '${{ secrets.api_key }}' > ~/private_keys/AuthKey_${{ secrets.api_key_id }}.p8
        
      - name: Build/release Electron app
        uses: samuelmeuli/action-electron-builder@v1
        with:
          # GitHub token, automatically provided to the action
          # (No need to define this secret in the repo settings)
          github_token: ${{ secrets.GIT_TOKEN }}

          # If the commit is tagged with a version (e.g. "v1.0.0"),
          # release the app after building
          # This workflow only runs on v* tags (see `on:` above), so this is
          # always true; kept explicit as a safety net.
          release: true
          mac_certs: ${{ secrets.mac_cert }}
          mac_certs_password: ${{ secrets.mac_certs_password }}
        env:
          NODE_OPTIONS: --openssl-legacy-provider  
          # macOS notarization API key
          API_KEY_ID: ${{ secrets.api_key_id }}
          API_KEY_ISSUER_ID: ${{ secrets.api_key_issuer_id }}
