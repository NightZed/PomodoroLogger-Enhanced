name: Build/release

# Manual-only release pipeline (CI lives in test.yml: every push to master
# and every PR runs lint + tests there -- pushes never release anything).
#   Actions -> Build/release -> Run workflow, two modes:
#   * `tag` left empty -> job 1 (semantic-release): lint + tests, then cut
#     the vX.Y.Z tag + GitHub Release. Job 2 (gated by `needs`) checks out
#     that tag, stamps the version into package.json, builds the
#     Windows/macOS/Linux installers and uploads them to that Release.
#   * `tag` filled in (e.g. v0.15.0) -> job 1 is skipped; job 2 alone
#     rebuilds the installers for that existing tag's release.
#   Versions are tracked by git tags only -- nothing is committed back to
#   the repository (see the semantic-release FAQ:
#   https://semantic-release.org/support/faq).
# Because job 2 is scheduled via `needs` inside the same run -- not by a
# tag-push *event* -- the auto-provided GITHUB_TOKEN is enough everywhere
# and no PAT is required.

# Run title in the Actions list: tells a release run and a rebuild run apart.
run-name: ${{ inputs.tag != '' && format('重建 {0} 的安装包', inputs.tag) || '发布新版本' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        # Rendered in the "Run workflow" panel right under the input box.
        description: >-
          留空 = 发布新版本：先跑 lint + 测试，再由 semantic-release 按
          Conventional Commits 自动决定版本号、打 vX.Y.Z tag，并构建
          Windows/macOS/Linux 安装包上传到该 Release（自上个版本以来若没有
          feat:/fix: 等提交则不会发版）。填写已有 tag（如 v0.15.0）=
          跳过发布，仅为该 tag 重建安装包。发布始终基于 master 最新提交。
        required: false
        type: string
        default: ''

# Serialize releases: only one run at a time, never cancel one (a cancelled
# run could leave a half-pushed tag).
concurrency:
  group: build-release
  cancel-in-progress: false

# Read-only by default; each job elevates only what it needs (same pattern
# as semantic-release's official release workflow).
permissions:
  contents: read

jobs:
  semantic-release:
    # Release mode only: runs when `tag` is left empty (rebuild runs skip it).
    if: inputs.tag == ''
    runs-on: ubuntu-latest

    permissions:
      contents: write        # create the tag/release
      issues: write          # comment on released issues
      pull-requests: write   # comment on released pull requests

    outputs:
      # NOTE: the action's output for the Git tag is `new_release_git_tag`
      # (there is no `new_release_tag` -- getting this wrong silently
      # yields an empty string and skips the build job).
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # Always release from the latest master, regardless of the branch
          # or tag selected in the "Use workflow from" dropdown.
          ref: master
          # Full history + tags are required for version analysis
          fetch-depth: 0
          # semantic-release authenticates through its own GITHUB_TOKEN env
          # var; never persist the checkout token.
          persist-credentials: false

      - name: Install Node.js and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test -- --ci --runInBand

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          # .releaserc.json only uses the default commit-analyzer +
          # release-notes-generator + @semantic-release/github trio. The
          # action pre-installs the bundled core plugins, so only github
          # must be listed here.
          extra_plugins: |
            @semantic-release/github@12
        env:
          # The auto-provided GITHUB_TOKEN is enough: it cannot trigger
          # follow-up workflows anyway, and the build job below is started
          # via `needs`, inside this same run -- no PAT required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    # Runs either as the build half of a release run (semantic-release
    # produced a fresh tag) or as a rebuild of an existing tag (`tag` filled).
    # NOTE: `!cancelled()` is required so this job's `if` is still evaluated
    # when the semantic-release job above is skipped (rebuild runs):
    # a skipped `needs` dependency would otherwise skip this job too,
    # regardless of its own condition.
    if: >-
      ${{ !cancelled() &&
      (inputs.tag != '' || needs.semantic-release.outputs.tag != '') }}
    needs: semantic-release
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write        # upload installers to the GitHub Release

    # Platforms to build on/for
    strategy:
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # Pin to the tag's commit: freshly released or manually selected
          # for a rebuild.
          ref: ${{ needs.semantic-release.outputs.tag || inputs.tag }}
          # Only used to fetch the ref; electron-builder does not need git
          # credentials afterwards.
          persist-credentials: false

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Ensure distutils is available for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare for app notarization
        if: startsWith(matrix.os, 'macos')
        # Import Apple API key for app notarization on macOS. The file lives in the
        # workspace because electron-builder's built-in notarize step gets its path
        # through APPLE_API_KEY below.
        run: |
          mkdir -p private_keys
          echo '${{ secrets.api_key }}' > private_keys/AuthKey_${{ secrets.api_key_id }}.p8

      - name: Stamp package.json version from tag
        shell: bash
        # electron-builder reads the version from package.json (installer
        # filenames, electron-updater, app.getVersion()), but the repository
        # keeps a placeholder version and tracks releases via tags only.
        # Write the released version into the CI working tree before
        # building: semantic-release's output (release mode) or the dispatch
        # tag with its "v" prefix stripped (rebuild mode).
        # --allow-same-version keeps job re-runs safe.
        env:
          SR_VERSION: ${{ needs.semantic-release.outputs.version }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$SR_VERSION"
          if [ -z "$VERSION" ]; then VERSION="${DISPATCH_TAG#v}"; fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build/release Electron app
        uses: samuelmeuli/action-electron-builder@v1
        with:
          # GitHub token, automatically provided to the action
          # (No need to define this secret in the repo settings)
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # semantic-release created the GitHub Release above; upload the
          # built artifacts to it.
          release: true
          mac_certs: ${{ secrets.mac_cert }}
          mac_certs_password: ${{ secrets.mac_certs_password }}
        env:
          # macOS notarization: electron-builder 26 notarizes through
          # @electron/notarize, which reads these variables.
          APPLE_API_KEY: ${{ github.workspace }}/private_keys/AuthKey_${{ secrets.api_key_id }}.p8
          APPLE_API_KEY_ID: ${{ secrets.api_key_id }}
          APPLE_API_ISSUER: ${{ secrets.api_key_issuer_id }}