name: Probe Windows arm64

# 手动探针，不参与发布。在真实的 Windows arm64 runner 上验证两件事：
#   1. get-windows 的 arm64 binding 能否编译（上游只有 ia32/x64 预编译，
#      install 时会走 node-pre-gyp 的 fallback-to-build）并被调用；
#   2. electron-builder 能否产出 win-arm64 的 NSIS 安装包。
#
# 成功标志：
#   - Install dependencies：preparing moduleName=get-windows arch=arm64 → finished
#   - get-windows smoke test：打印一行窗口 JSON
#   - Package：packaging platform=win32 arch=arm64，且生成 *win-arm64*setup.exe
# 失败标志：
#   - node-pre-gyp ERR! / gyp ERR! / MSB8020（缺 arm64 工具链）/ LNK1112
#
# 若 windows-11-vs2026-arm 排队过久，可换成 windows-11-arm（2026-09 起该标签
# 已迁移到同一 Visual Studio 2026 镜像）。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall 会跑 electron-builder install-app-deps，也就是 get-windows
      # arm64 binding 的编译点；这一步失败就不用往下看。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: get-windows smoke test
        shell: pwsh
        run: |
          node --input-type=module -e 'import {activeWindow} from "get-windows"; const w = await activeWindow(); console.log(JSON.stringify(w));'

      - name: Build
        run: pnpm build

      - name: Package arm64 installer
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-arm64
          path: release/*win-arm64*
          if-no-files-found: error
          retention-days: 7
