name: Semantic Release

on:
  push:
    branches:
      - master

# Serialize releases: only one semantic-release run at a time,
# never cancel one (a cancelled run could leave a half-pushed tag).
concurrency:
  group: semantic-release-master
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # Full history + tags are required for version analysis
          fetch-depth: 0
          # semantic-release authenticates through its own GITHUB_TOKEN env
          # var; never persist the checkout token.
          persist-credentials: false

      - name: Install Node.js and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test -- --ci --runInBand

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          # .releaserc.json only uses the default commit-analyzer +
          # release-notes-generator + @semantic-release/github trio. The
          # action pre-installs the bundled core plugins, so only github
          # must be listed here. Versions are no longer committed back to
          # the repo (no @semantic-release/git/npm/changelog) -- they are
          # tracked by git tags alone, and the "Build apps & upload to
          # GitHub Release" workflow stamps the tag version at build time.
          extra_plugins: |
            @semantic-release/github@12
        env:
          # Must be a PAT (with contents:write) so that the tag created via
          # the GitHub API still triggers the "Build apps & upload to GitHub
          # Release" workflow -- events fired with the auto-provided
          # GITHUB_TOKEN never start follow-up workflow runs. Nothing is
          # pushed back to master anymore, so this token only creates the
          # tag + release. (The semantic-release docs prefer a GitHub App
          # token over a PAT when tighter security is needed.)
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
